<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ops Dashboard — Commerce Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css?v=holo-touch-1" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">OPS · COMMERCE INTEL</div>
      <div id="healthBadge" class="health warn">HEALTH —</div>
      <nav class="nav" id="moduleNav">
        <button data-module="map" class="active" title="Shortcut 1">Map</button>
        <button data-module="pipeline" title="Shortcut 2">Pipeline</button>
        <button data-module="memory" title="Shortcut 3">Memory</button>
        <button data-module="chat" title="Shortcut 4">Chat</button>
      </nav>
      <button id="refreshBtn" class="pill-btn" title="Refresh snapshot">Refresh</button>
      <button id="globalMic" class="icon-btn mic" title="Voice command (all modules)">MIC</button>
      <button id="logoutBtn" class="pill-btn" title="Logout">Logout</button>
    </header>
    <!-- Holographic voice plancia: labels anchored to light points; voice + touch -->
    <div id="holoVoicePlancia" class="holo-voice-plancia" aria-label="Plancia vocale olografica">
      <button type="button" class="holo-node" data-holo-action="map" style="--hx:18%;--hy:42%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">MAPPA</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="pipeline" style="--hx:32%;--hy:28%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">PIPELINE</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="memory" style="--hx:68%;--hy:30%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">MEMORY</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="chat" style="--hx:82%;--hy:48%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">CHAT</span>
      </button>
      <button type="button" class="holo-node holo-node--amber" data-holo-action="mic" style="--hx:50%;--hy:52%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">MIC</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="orbit" style="--hx:44%;--hy:72%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">ORBIT</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="nord" style="--hx:56%;--hy:72%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">NORD</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="zoom-citta" style="--hx:22%;--hy:68%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">ZOOM CITTÀ</span>
      </button>
      <button type="button" class="holo-node" data-holo-action="analizza" style="--hx:78%;--hy:68%;">
        <span class="holo-dot" aria-hidden="true"></span>
        <span class="holo-label">ANALIZZA</span>
      </button>
    </div>
    <div id="statsStrip" class="stats-strip" aria-live="polite">
      <span id="statDay" class="stat mono">DAY —</span>
      <span id="statTops" class="stat">Tops —</span>
      <span id="statErrors" class="stat">Errors —</span>
      <span id="statCoverage" class="stat">Coverage —</span>
      <span id="statSecrets" class="stat">API —</span>
      <span id="statUpdated" class="stat muted mono">Updated —</span>
    </div>

    <main class="stage">
      <section class="viewport" id="viewport">
        <div class="overlay-hud">
          <div class="legend" id="moduleLegend">Loading…</div>
          <div class="legend mono" id="coverageMini"></div>
        </div>
        <div id="mapChrome" class="map-chrome" hidden>
          <form id="mapSearchForm" class="map-search" autocomplete="off">
            <input id="mapSearchInput" type="search" placeholder="Search country, city, place…" enterkeyhint="search" />
            <button type="submit" class="pill-btn primary">Go</button>
          </form>
          <div class="map-tools">
            <button type="button" id="mapNorthBtn" class="pill-btn" title="Reset north">N</button>
            <button type="button" id="mapOrbitBtn" class="pill-btn" title="Orbital overview">Orbit</button>
          </div>
          <div id="mapPickCard" class="map-pick-card" hidden>
            <div class="map-pick-title" id="mapPickTitle">—</div>
            <div class="map-pick-detail muted" id="mapPickDetail"></div>
            <div class="map-pick-actions">
              <button type="button" id="mapPickAnalyze" class="pill-btn primary" hidden>Analizza in chat</button>
              <button type="button" id="mapPickCompare" class="pill-btn" hidden>Confronta</button>
            </div>
          </div>
          <div id="mapFilterChips" class="filter-chips" aria-label="Filtri live tops"></div>
          <div id="coverageScrub" class="coverage-scrub" hidden>
            <label for="coverageScrubRange">Coverage focus</label>
            <input id="coverageScrubRange" type="range" min="0" max="0" value="0" />
            <span id="coverageScrubLabel" class="mono muted">—</span>
          </div>
        </div>
        <div id="compareStrip" class="compare-strip" hidden>
          <div class="compare-slot" id="compareA"><span class="muted">Pin A</span></div>
          <div class="compare-slot" id="compareB"><span class="muted">Pin B</span></div>
          <button type="button" id="compareClear" class="pill-btn">Clear</button>
        </div>
        <div id="glCanvas" class="gl-host" style="position:absolute;inset:0;"></div>
        <div id="chatPanel" class="chat-wrap" hidden>
          <div class="threads" id="threadList"></div>
          <div class="chat-model-bar">
            <label class="chat-model-label" for="chatModelSelect">Model</label>
            <select id="chatModelSelect" class="chat-model-select" title="Chat model"></select>
            <span id="chatModelHint" class="chat-model-hint muted mono"></span>
            <button type="button" id="exportChatBtn" class="pill-btn" title="Export thread">Export</button>
          </div>
          <div id="chatPromptChips" class="prompt-chips" aria-label="Suggested prompts"></div>
          <div class="messages" id="messageList"></div>
          <div class="composer">
            <button id="chatMic" class="icon-btn mic" title="Dictate">MIC</button>
            <input id="chatInput" type="text" placeholder="Ask about tops, sources, memory…" autocomplete="off" />
            <button id="sendChat" class="pill-btn primary">Send</button>
          </div>
        </div>
      </section>

      <aside class="side" id="sidePanel">
        <div class="side-head">
          <h2 id="sideTitle">Ops</h2>
          <div id="sideTools" class="side-tools"></div>
        </div>
        <div id="sideBody" class="list"></div>
      </aside>
    </main>

    <footer class="footer">
      <span id="footerLeft">Verification threshold raised · mechanical first · keys 1–4 switch modules</span>
      <span id="footerRight" class="mono"></span>
    </footer>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/app.js?v=holo-touch-1"></script>
</body>
</html>
