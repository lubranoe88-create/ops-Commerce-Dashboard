<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPS · COMMERCE INTEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css?v=holo-pack-4" />
</head>
<body>
  <div id="app" class="holo-home">
    <header class="topbar topbar--holo">
      <div class="brand-block">
        <div class="brand">OPS · COMMERCE INTEL</div>
        <div class="brand-tag">GLOBAL OPERATIONS · INTELLIGENCE · ADVANTAGE</div>
      </div>
      <div class="top-status" aria-live="polite">
        <span id="healthBadge" class="health warn">HEALTH —</span>
        <span id="statDay" class="stat-pill mono">DAY —</span>
        <span id="statCoverage" class="stat-pill">COVERAGE —</span>
      </div>
      <div class="top-right">
        <span id="utcClock" class="mono utc-clock">--:--:-- UTC</span>
        <nav class="nav nav--ghost" id="moduleNav" aria-label="Moduli">
          <button data-module="map" class="active" title="Map">Map</button>
          <button data-module="pipeline" title="Pipeline">Pipe</button>
          <button data-module="memory" title="Memory">Mem</button>
          <button data-module="chat" title="Chat">Chat</button>
        </nav>
        <button id="refreshBtn" class="ghost-btn" title="Refresh">↻</button>
        <button id="logoutBtn" class="ghost-btn" title="Logout">⎋</button>
      </div>
    </header>

    <!-- Hidden stats kept for JS updateStatsStrip compatibility -->
    <div id="statsStrip" class="stats-strip stats-strip--sr" aria-hidden="true">
      <span id="statTops" class="stat">Tops —</span>
      <span id="statErrors" class="stat">Errors —</span>
      <span id="statSecrets" class="stat">API —</span>
      <span id="statUpdated" class="stat muted mono">Updated —</span>
    </div>

    <main class="stage stage--holo">
      <section class="viewport" id="viewport">
        <div id="glCanvas" class="gl-host" style="position:absolute;inset:0;"></div>
        <div class="overlay-hud overlay-hud--minimal">
          <div class="legend" id="moduleLegend"></div>
          <div class="legend mono" id="coverageMini"></div>
        </div>
        <!-- Holo nodes INSIDE viewport: only the dots capture events (no full-screen blocker) -->
        <div id="holoVoicePlancia" class="holo-voice-plancia holo-voice-plancia--overlay" aria-label="Plancia vocale olografica">
          <button type="button" class="holo-node" data-holo-action="map" style="--hx:14%;--hy:22%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">MAPPA</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="pipeline" style="--hx:26%;--hy:14%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">PIPELINE</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="memory" style="--hx:74%;--hy:14%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">MEMORY</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="chat" style="--hx:86%;--hy:22%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">CHAT</span>
          </button>
          <button type="button" class="holo-node holo-node--amber" data-holo-action="mic" style="--hx:50%;--hy:18%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">MIC</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="orbit" style="--hx:40%;--hy:88%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">ORBIT</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="nord" style="--hx:52%;--hy:88%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">NORD</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="zoom-citta" style="--hx:18%;--hy:88%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">ZOOM CITTÀ</span>
          </button>
          <button type="button" class="holo-node" data-holo-action="analizza" style="--hx:78%;--hy:88%;">
            <span class="holo-dot" aria-hidden="true"></span>
            <span class="holo-label">ANALIZZA</span>
          </button>
        </div>
        <div id="mapChrome" class="map-chrome" hidden>
          <form id="mapSearchForm" class="map-search" autocomplete="off">
            <input id="mapSearchInput" type="search" placeholder="Search place…" enterkeyhint="search" />
            <button type="submit" class="pill-btn primary">Go</button>
          </form>
          <div class="map-tools">
            <button type="button" id="mapNorthBtn" class="pill-btn" title="Reset north">N</button>
            <button type="button" id="mapOrbitBtn" class="pill-btn" title="Orbital overview">Orbit</button>
          </div>
          <div id="mapPickCard" class="map-pick-card" hidden>
            <div class="map-pick-title" id="mapPickTitle">—</div>
            <div class="map-pick-detail muted" id="mapPickDetail"></div>
            <div class="map-pick-actions">
              <button type="button" id="mapPickAnalyze" class="pill-btn primary" hidden>Analizza in chat</button>
              <button type="button" id="mapPickCompare" class="pill-btn" hidden>Confronta</button>
            </div>
          </div>
        </div>
        <!-- Interactive #9/#10 under holo shell: always on map, not buried in collapsed chrome -->
        <div id="mapFilterChips" class="filter-chips filter-chips--holo" aria-label="Filtri live tops"></div>
        <div id="coverageScrub" class="coverage-scrub coverage-scrub--holo" hidden>
          <label for="coverageScrubRange">Coverage</label>
          <input id="coverageScrubRange" type="range" min="0" max="0" value="0" />
          <span id="coverageScrubLabel" class="mono muted">—</span>
        </div>
        <div id="compareStrip" class="compare-strip compare-strip--holo" hidden>
          <div class="compare-slot" id="compareA"><span class="muted">Pin A</span></div>
          <div class="compare-slot" id="compareB"><span class="muted">Pin B</span></div>
          <button type="button" id="compareClear" class="pill-btn">Clear</button>
        </div>
        <div id="chatPanel" class="chat-wrap" hidden>
          <div class="threads" id="threadList"></div>
          <div class="chat-model-bar">
            <label class="chat-model-label" for="chatModelSelect">Model</label>
            <select id="chatModelSelect" class="chat-model-select" title="Chat model"></select>
            <span id="chatModelHint" class="chat-model-hint muted mono"></span>
            <button type="button" id="exportChatBtn" class="pill-btn" title="Export thread">Export</button>
          </div>
          <div id="chatPromptChips" class="prompt-chips" aria-label="Suggested prompts"></div>
          <div class="messages" id="messageList"></div>
          <div class="composer composer--legacy" hidden>
            <button id="chatMic" class="icon-btn mic" title="Dictate">MIC</button>
            <input id="chatInputLegacy" type="text" disabled tabindex="-1" aria-hidden="true" />
            <button id="sendChatLegacy" class="pill-btn primary" type="button" tabindex="-1">Send</button>
          </div>
        </div>
      </section>

      <aside class="side side--holo" id="sidePanel">
        <div class="side-head">
          <h2 id="sideTitle">Ops</h2>
          <div id="sideTools" class="side-tools"></div>
        </div>
        <div id="sideBody" class="list"></div>
      </aside>
    </main>

    <!-- Bottom capsule matching reference photo -->
    <div class="analizza-bar" id="analizzaBar">
      <input id="chatInput" type="text" placeholder="Analizza…" autocomplete="off" />
      <div class="analizza-actions">
        <button type="button" id="globalMic" class="analizza-mic" title="Voce">
          <span class="mic-glyph" aria-hidden="true"></span>
          <span>MIC</span>
        </button>
        <button type="button" id="sendChat" class="analizza-send" title="Invia">◎</button>
      </div>
    </div>

    <footer class="footer footer--holo">
      <span id="footerLeft" class="sr-only">Ops commerce dashboard</span>
      <span id="footerRight" class="mono"></span>
    </footer>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/app.js?v=holo-pack-4"></script>
</body>
</html>
