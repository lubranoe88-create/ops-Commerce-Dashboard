services:
  - type: web
    name: ops-commerce-dashboard
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      # Do not overwrite dashboard secrets on blueprint sync
      - key: SITE_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: MEMORY_DB_PATH
        value: /opt/render/project/src/data/memory.sqlite
      - key: COOKIE_SECURE
        value: "true"
      - key: VERIFICATION_THRESHOLD
        value: "0.72"
      - key: BROWSER_USE_ENABLED
        value: "true"
      - key: BROWSER_USE_ALLOW_ORIGIN
        value: https://ops-commerce-dashboard.onrender.com
      - key: AI_ENTITLEMENT
        value: paid
